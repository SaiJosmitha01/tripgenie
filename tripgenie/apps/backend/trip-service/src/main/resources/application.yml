spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]
  application:
    name: trip-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgenie
    username: tripgenie
    password: tripgenie
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    admin:
      auto-create: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cache:
    type: redis

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kafka

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tripgenie:
  ai:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    retry-attempts: ${AI_RETRY_ATTEMPTS:2}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:60s}
  maps:
    base-url: ${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    retry-attempts: ${GOOGLE_MAPS_RETRY_ATTEMPTS:2}
    connect-timeout: ${GOOGLE_MAPS_CONNECT_TIMEOUT:5s}
    read-timeout: ${GOOGLE_MAPS_READ_TIMEOUT:20s}
  cache:
    trip-ttl: ${TRIP_CACHE_TTL:10m}
    trip-list-ttl: ${TRIP_LIST_CACHE_TTL:5m}
    place-resolution-ttl: ${PLACE_RESOLUTION_CACHE_TTL:7d}
  security:
    jwt:
      issuer: tripgenie
      secret: ${JWT_SECRET:tripgenie-development-secret-key-change-me-minimum-32-bytes}
      access-token-ttl: PT2H

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
  level:
    root: INFO
    com.tripgenie: INFO

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]
  application:
    name: trip-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgenie
    username: tripgenie
    password: tripgenie
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tripgenie:
  security:
    jwt:
      issuer: tripgenie
      secret: ${JWT_SECRET:tripgenie-development-secret-key-change-me-minimum-32-bytes}
      access-token-ttl: PT2H

logging:
  level:
    root: INFO
    com.tripgenie: INFO

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]
  application:
    name: trip-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgenie
    username: tripgenie
    password: tripgenie
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    admin:
      auto-create: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tripgenie:
  ai:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:60s}
  security:
    jwt:
      issuer: tripgenie
      secret: ${JWT_SECRET:tripgenie-development-secret-key-change-me-minimum-32-bytes}
      access-token-ttl: PT2H

logging:
  level:
    root: INFO
    com.tripgenie: INFO

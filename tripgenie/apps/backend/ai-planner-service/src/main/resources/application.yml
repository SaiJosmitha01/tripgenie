spring:
  application:
    name: ai-planner-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgenie
    username: tripgenie
    password: tripgenie
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.tripgenie: INFO

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]
  application:
    name: auth-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgenie
    username: tripgenie
    password: tripgenie
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tripgenie:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      issuer: tripgenie
      secret: ${JWT_SECRET:tripgenie-development-secret-key-change-me-minimum-32-bytes}
      access-token-ttl: PT2H

logging:
  level:
    root: INFO
    com.tripgenie: INFO
